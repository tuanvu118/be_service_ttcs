# Chạy file này trước:
#   docker compose -f docker-compose.rabbitmq.yml up -d
#
# File này tạo:
#   - Container RabbitMQ dùng chung cho Backend + QR Service
#   - External network "ttcs_shared" để 2 service có thể kết nối vào

name: ttcs-infra

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ttcs_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ttcs_shared

volumes:
  rabbitmq_data:

networks:
  ttcs_shared:
    name: ttcs_shared
    driver: bridge
